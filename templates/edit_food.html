<!DOCTYPE html>

<html>

<head>

```
<title>Edit Food - Cloud Food Ordering</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">
```

</head>

<body>

```
<header>

    <h1>✏️ Edit Food</h1>

</header>


<section class="cart">

    <h2>🍔 Food Management</h2>


    {% for food in foods %}

        <div class="cart-item">

            <h2>{{ food.name }}</h2>

            <form method="POST"
                  action="/admin/edit_food">

                <input
                    type="hidden"
                    name="id"
                    value="{{ food.id }}"
                >


                <label>Food Name</label>

                <br>

                <input
                    type="text"
                    name="name"
                    value="{{ food.name }}"
                    required
                >

                <br><br>


                <label>Category</label>

                <br>

                <input
                    type="text"
                    name="category"
                    value="{{ food.category }}"
                    required
                >

                <br><br>


                <label>Price</label>

                <br>

                <input
                    type="number"
                    name="price"
                    value="{{ food.price }}"
                    step="0.01"
                    required
                >

                <br><br>


                <label>Image Filename</label>

                <br>

                <input
                    type="text"
                    name="image"
                    value="{{ food.image }}"
                    required
                >

                <br><br>


                <label>Description</label>

                <br>

                <textarea
                    name="description"
                    rows="4"
                    required
                >{{ food.description }}</textarea>

                <br><br>


                <button type="submit">
                    💾 Save Changes
                </button>

            </form>

        </div>

        <br>

    {% endfor %}


    <button onclick="window.location.href='/admin'">
        ⬅️ Back to Admin
    </button>

</section>
```

</body>

</html>
